version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 1234

  mysql:
    image: mysql:latest
    container_name: ticketing-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: ticketing
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppw
    volumes:
      - mysql-data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: ticketing-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data:
