# port setting
quarkus.http.port=6061
quarkus.http.test-port=7071

# cors setting
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE
quarkus.http.cors.headers=accept,origin,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Type,Authorization

# Redis setting
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.password=1234

# MongoDB setting
quarkus.mongodb.connection-string=mongodb://admin:1234@localhost:27018
quarkus.mongodb.database=ticketing

# MySQL JDBC setting
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# RabbitMQ setting
quarkus.rabbitmq.username=root
quarkus.rabbitmq.password=1234
quarkus.rabbitmq.host=localhost
quarkus.rabbitmq.port=5672
quarkus.rabbitmq.virtual-host=/
quarkus.rabbitmq.devservices.enable=false

mp.messaging.outgoing.ticket-process-queue.connector=smallrye-rabbitmq
mp.messaging.outgoing.ticket-process-queue-vip.connector=smallrye-rabbitmq
mp.messaging.outgoing.ticket-process-queue.address=ticket-process-queue

mp.messaging.incoming.ticket-process-queue.connector=smallrye-rabbitmq
mp.messaging.incoming.ticket-process-queue.address=ticket-process-queue

# DLQ Producer setting
mp.messaging.outgoing.ticket-dlq.connector=smallrye-rabbitmq
mp.messaging.outgoing.ticket-dlq.address=ticket-dlq


